services:
  wangala:
    build:
      context: .
      dockerfile: Dockerfile.wangala
      args:
        VITE_DEMO_MODE: "false"
        VITE_CHAT_API_URL: ""
    restart: unless-stopped
    environment:
      PORT: 8787
      LLM_API_URL: ${LLM_API_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:?Renseignez LLM_API_KEY dans .env}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-20b}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-openai/gpt-oss-120b,qwen/qwen3.6-27b}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-14000}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-1200}
      PROVIDER_RETRIES: ${PROVIDER_RETRIES:-1}
      E2B_API_KEY: ${E2B_API_KEY:-}
      POLLINATIONS_API_KEY: ${POLLINATIONS_API_KEY:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-zimage}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      ALLOWED_ORIGIN: https://${DOMAIN:?Renseignez DOMAIN dans .env}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
    networks:
      - web
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - wangala
    environment:
      DOMAIN: ${DOMAIN:?Renseignez DOMAIN dans .env}
      ACME_EMAIL: ${ACME_EMAIL:?Renseignez ACME_EMAIL dans .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    security_opt:
      - no-new-privileges:true

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
